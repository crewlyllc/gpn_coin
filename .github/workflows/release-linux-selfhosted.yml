name: Linux binaries (self-hosted)

# GitHub-hosted runners on this account are billing-blocked, so the Linux leg of
# release-unix.yml had 0 runs ever and linux-latest froze at the 2026-10-21
# bundle. This lane builds the SAME package (layout=bundle: gpn_* + gpn-node at
# the root, scripts/install-ollama*.sh, gpn-node.example.toml,
# README-FIRST-RUN.txt) on the self-hosted Linux/GPU runner and publishes the
# rolling `linux-latest` release. macOS stays on the hosted matrix.
#
# Conventions copied from ci.yml (item #69 runner policy): every cargo call runs
# under `nice -n 19` with CARGO_BUILD_JOBS=2 and a persistent CARGO_TARGET_DIR
# under /home/jeremyg/.ci-cache, so the live node/provider on this box keep their
# headroom and re-runs are incremental.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  actions: write
  contents: write   # to publish the linux-latest GitHub Release asset

# One release at a time: a second dispatch must never build/publish concurrently.
concurrency:
  group: release-linux-selfhosted
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  # Canonical genesis runtime WASM — must be byte-identical before and after the
  # build (the runtime build script embeds it, never regenerates it).
  CANON_SHA: 76f37b23a33e8ba3ada91849e69b66836590673f14ea009ef6d914eb0d16fa97
  CT_NODE: /home/jeremyg/.ci-cache/gpn-node-target
  CT_AGENT: /home/jeremyg/.ci-cache/gpn-agent-target
  # Same lock local/interactive builds take, so a release never competes with
  # them for RAM/CPU on this box.
  BUILD_LOCK: /home/jeremyg/.gpn/build.lock

jobs:
  linux:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: canonical runtime WASM (pre-build)
        run: |
          set -euo pipefail
          got=$(sha256sum gpn-node/runtime/gpn_runtime.compact.compressed.wasm | cut -d' ' -f1)
          echo "canonical wasm: $got"
          [ "$got" = "$CANON_SHA" ] || { echo "::error::canonical runtime WASM is $got, expected $CANON_SHA"; exit 1; }

      - name: rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal >/dev/null
          rustup target add wasm32-unknown-unknown --toolchain "$RUST_TOOLCHAIN" >/dev/null

      - name: build (waits for ~/.gpn/build.lock)
        # -w 7200 waits up to 2 h for a local build to finish, then fails loudly
        # instead of stacking a second heavyweight cargo build on the box.
        run: |
          set -euo pipefail
          (
            flock -w 7200 9 || { echo "::error::could not acquire $BUILD_LOCK within 2 h"; exit 1; }
            echo "acquired build lock $(date -Is)"
            echo "== build node"
            CARGO_TARGET_DIR="$CT_NODE" nice -n 19 cargo build --release \
              --manifest-path gpn-node/Cargo.toml -p gpn-node
            echo "== build agent"
            CARGO_TARGET_DIR="$CT_AGENT" nice -n 19 cargo build --release \
              --manifest-path gpn-agent/Cargo.toml --bins
            echo "released build lock $(date -Is)"
          ) 9>"$BUILD_LOCK"

      - name: package (layout=bundle, verifies canonical WASM + completeness)
        run: |
          set -euo pipefail
          bash scripts/ci/package-linux-bundle.sh "$RUNNER_TEMP/gpn-linux.tar.gz"
          sz=$(stat -c%s "$RUNNER_TEMP/gpn-linux.tar.gz")
          sh=$(sha256sum "$RUNNER_TEMP/gpn-linux.tar.gz" | cut -d' ' -f1)
          {
            echo "### linux-latest asset"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- size: $sz bytes"
            echo "- sha256: \`$sh\`"
            echo "- canonical wasm: \`$CANON_SHA\` (untouched)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: publish GitHub Release (rolling 'linux-latest')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No jq on this runner; the helper is stdlib-only Python.
        run: |
          set -euo pipefail
          python3 scripts/ci/publish-release-asset.py \
            --tag linux-latest \
            --title "GPN linux (latest)" \
            --body "Rolling GPN Linux build. commit $GITHUB_SHA" \
            --file "$RUNNER_TEMP/gpn-linux.tar.gz" \
            --name gpn-linux.tar.gz
