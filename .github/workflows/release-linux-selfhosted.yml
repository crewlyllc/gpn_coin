name: Linux binaries (self-hosted)

# GitHub-hosted runners on this account are billing-blocked, so the Linux leg of
# release-unix.yml had 0 runs ever and linux-latest froze at the 2026-10-21
# bundle. This lane builds the SAME package (layout=bundle: gpn_* + gpn-node at
# the root, scripts/install-ollama*.sh, gpn-node.example.toml,
# README-FIRST-RUN.txt) on the self-hosted Linux/GPU runner and publishes the
# rolling `linux-latest` release. macOS stays on the hosted matrix.
#
# Conventions copied from ci.yml (item #69 runner policy): every cargo call runs
# under `nice -n 19` with CARGO_BUILD_JOBS=2 and a persistent CARGO_TARGET_DIR
# under /home/jeremyg/.ci-cache, so the live node/provider on this box keep their
# headroom and re-runs are incremental.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  actions: write
  contents: write   # to publish the linux-latest GitHub Release asset
  id-token: write     # Sigstore OIDC - required for build provenance
  attestations: write # to store the provenance attestation against the repo

# One release at a time: a second dispatch must never build/publish concurrently.
concurrency:
  group: release-linux-selfhosted
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  # Canonical genesis runtime WASM - must be byte-identical before and after the
  # build (the runtime build script embeds it, never regenerates it).
  CANON_SHA: 76f37b23a33e8ba3ada91849e69b66836590673f14ea009ef6d914eb0d16fa97
  CT_NODE: /home/jeremyg/.ci-cache/gpn-node-target
  CT_AGENT: /home/jeremyg/.ci-cache/gpn-agent-target
  # Same lock local/interactive builds take, so a release never competes with
  # them for RAM/CPU on this box.
  BUILD_LOCK: /home/jeremyg/.gpn/build.lock

jobs:
  linux:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}   # build exactly the commit CI verified

      - name: canonical runtime WASM (pre-build)
        run: |
          set -euo pipefail
          got=$(sha256sum gpn-node/runtime/gpn_runtime.compact.compressed.wasm | cut -d' ' -f1)
          echo "canonical wasm: $got"
          [ "$got" = "$CANON_SHA" ] || { echo "::error::canonical runtime WASM is $got, expected $CANON_SHA"; exit 1; }

      - name: rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal >/dev/null
          rustup target add wasm32-unknown-unknown --toolchain "$RUST_TOOLCHAIN" >/dev/null

      - name: build (waits for ~/.gpn/build.lock)
        # This runner has 15 GB RAM and also hosts the access point, ollama models
        # and the CI jobs. A full-parallelism release build got OOM-killed
        # (signal 9, ~900 MB RSS rustc) -- cap the job count so the box survives.
        env:
          CARGO_BUILD_JOBS: "2"
        # -w 7200 waits up to 2 h for a local build to finish, then fails loudly
        # instead of stacking a second heavyweight cargo build on the box.
        run: |
          set -euo pipefail
          (
            flock -w 7200 9 || { echo "::error::could not acquire $BUILD_LOCK within 2 h"; exit 1; }
            echo "acquired build lock $(date -Is)"
            echo "== build node"
            CARGO_TARGET_DIR="$CT_NODE" nice -n 19 cargo build --release \
              --manifest-path gpn-node/Cargo.toml -p gpn-node
            echo "== build agent"
            CARGO_TARGET_DIR="$CT_AGENT" nice -n 19 cargo build --release \
              --manifest-path gpn-agent/Cargo.toml --bins
            echo "released build lock $(date -Is)"
          ) 9>"$BUILD_LOCK"

      - name: package (layout=bundle, verifies canonical WASM + completeness)
        run: |
          set -euo pipefail
          bash scripts/ci/package-linux-bundle.sh "$RUNNER_TEMP/gpn-linux.tar.gz"
          sz=$(stat -c%s "$RUNNER_TEMP/gpn-linux.tar.gz")
          sh=$(sha256sum "$RUNNER_TEMP/gpn-linux.tar.gz" | cut -d' ' -f1)
          {
            echo "### linux-latest asset"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- size: $sz bytes"
            echo "- sha256: \`$sh\`"
            echo "- canonical wasm: \`$CANON_SHA\` (untouched)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Provenance: the Windows lane has refused to publish an unsigned zip since
      # 0.3.79; this lane published the linux tarball with no attestation at all
      # until 0.3.82 (found while working the release checklist's section 7 gate, which
      # says a release must not be cut on an unattested asset). Same two
      # mechanisms, one contract:
      #   public repo  -> actions/attest-build-provenance (gh attestation verify)
      #   private repo -> keyless cosign (Fulcio/Rekor), bundle beside the tarball
      - name: Check attestation availability (repo visibility)
        id: attest_gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys, urllib.request

          req = urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"],
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "User-Agent": "gpn-ci"})
          d = json.load(urllib.request.urlopen(req, timeout=60))
          vis = d.get("visibility")
          method = "github" if vis == "public" else "cosign"
          print("repo visibility: %s (private=%s)" % (vis, d.get("private")))
          print("provenance method: %s" % method)
          with open(sys.argv[1], "a") as f:
              f.write("method=%s\n" % method)
          PY

      - name: Attest build provenance (linux tarball, public repo)
        if: steps.attest_gate.outputs.method == 'github'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: '${{ runner.temp }}/gpn-linux.tar.gz'

      - name: Sign release artifact keyless (linux tarball, private repo)
        if: steps.attest_gate.outputs.method == 'cosign'
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/gpn-linux.tar.gz"
          bundle="$tgz.bundle"
          cosign="$RUNNER_TEMP/cosign"
          if [ ! -x "$cosign" ]; then
            curl -sSL -o "$cosign" https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
            chmod +x "$cosign"
          fi
          "$cosign" version
          # Keyless: the job's OIDC token is exchanged with Fulcio for a
          # short-lived cert; signature + cert + Rekor entry land in the bundle.
          "$cosign" sign-blob --yes --bundle "$bundle" "$tgz"
          [ -s "$bundle" ] || { echo "::error::cosign produced no bundle at $bundle"; exit 1; }
          echo "signed: $bundle ($(stat -c%s "$bundle") bytes)"

      - name: Provenance gate - refuse to publish an unsigned artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METHOD: ${{ steps.attest_gate.outputs.method }}
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/gpn-linux.tar.gz"
          bundle="$tgz.bundle"
          sh=$(sha256sum "$tgz" | cut -d' ' -f1)
          if [ "$METHOD" = "github" ]; then
            python3 - "$sh" <<'PY'
          import json, os, sys, urllib.request

          sha = sys.argv[1]
          url = "https://api.github.com/repos/%s/attestations/sha256:%s" % (
              os.environ["GITHUB_REPOSITORY"], sha)
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "User-Agent": "gpn-ci"})
          n = len(json.load(urllib.request.urlopen(req, timeout=60)).get("attestations") or [])
          print("attestations for sha256:%s = %d" % (sha, n))
          if n < 1:
              sys.exit("no attestation exists for the artifact about to be published")
          PY
          else
            [ -s "$bundle" ] || { echo "::error::no signature bundle for $tgz - refusing to publish an unattested artifact"; exit 1; }
            bsz=$(stat -c%s "$bundle")
            [ "$bsz" -ge 200 ] || { echo "::error::signature bundle is $bsz bytes - refusing to publish"; exit 1; }
            ident="^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release-linux-selfhosted\.yml@.*$"
            "$RUNNER_TEMP/cosign" verify-blob --bundle "$bundle" \
              --certificate-identity-regexp "$ident" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' "$tgz"
            echo 'keyless signature verified against this workflow identity'
          fi
          echo "provenance gate PASSED (method=$METHOD, sha256=$sh)"

      # 2026-11-08: the debug cache has filled the root filesystem four times
      # (2026-10-19 it halted the chain). The prune timer exists now, but a
      # release build is exactly when it grows - clean it as part of the build
      # that created it, so the next build starts from a sane disk.
      - name: reclaim the debug profile after packaging
        if: always()
        run: |
          set -uo pipefail
          df -h / | tail -1
          for d in "$HOME/.ci-cache"/*/; do
            [ -d "${d}debug" ] && rm -rf "${d}debug" && echo "removed ${d}debug"
          done
          df -h / | tail -1

      - name: publish GitHub Release (rolling 'linux-latest')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No jq on this runner; the helper is stdlib-only Python.
        run: |
          set -euo pipefail
          python3 scripts/ci/publish-release-asset.py \
            --tag linux-latest \
            --title "GPN linux (latest)" \
            --body "Rolling GPN Linux build. commit $GITHUB_SHA" \
            --file "$RUNNER_TEMP/gpn-linux.tar.gz" \
            --name gpn-linux.tar.gz
          bundle="$RUNNER_TEMP/gpn-linux.tar.gz.bundle"
          if [ -s "$bundle" ]; then
            python3 scripts/ci/publish-release-asset.py \
              --tag linux-latest \
              --title "GPN linux (latest)" \
              --body "Rolling GPN Linux build. commit $GITHUB_SHA" \
              --file "$bundle" \
              --name gpn-linux.tar.gz.bundle
          else
            echo 'signature: none published (GitHub-native attestation path)'
          fi
