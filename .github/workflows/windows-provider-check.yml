name: Windows provider readiness check

# Read-only diagnostic: reports whether this self-hosted Windows box is ready to
# run as a GPN AI provider (item 4). Makes NO changes and starts nothing
# persistent (the heartbeat smoke test is started then stopped). Results are
# printed and uploaded as the `provider-check` artifact for programmatic review.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: Collect diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'provider-check.txt'
          function Say($m) { Write-Host $m; Add-Content -Path $out -Value $m }

          Say "== Ollama =="
          try {
            $t = Invoke-RestMethod "http://127.0.0.1:11434/api/tags" -TimeoutSec 8
            $names = @($t.models | ForEach-Object { $_.name })
            Say "Ollama OK; models: $($names -join ', ')"
            if ($names -contains 'llama3.2:1b') { Say "llama3.2:1b: PRESENT" } else { Say "llama3.2:1b: MISSING" }
          } catch { Say "Ollama NOT reachable at 127.0.0.1:11434 ($($_.Exception.Message))" }

          Say "== running gpn processes =="
          Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -match 'gpn' } | ForEach-Object { Say "  $($_.ProcessName) PID=$($_.Id)" }

          Say "== C:\gpn\bin =="
          if (Test-Path 'C:\gpn\bin') {
            Get-ChildItem 'C:\gpn\bin' -Filter *.exe | ForEach-Object { Say "  $($_.Name)" }
          } else { Say "  (absent)" }

          Say "== GPN_PROVIDER_ENDPOINT =="
          Say "  value: '$($env:GPN_PROVIDER_ENDPOINT)'"

          Say "== heartbeat binary smoke test =="
          $exe = 'C:\gpn\bin\gpn_provider_status.exe'
          if (Test-Path $exe) {
            try {
              $p = Start-Process -FilePath $exe -ArgumentList @('--listen','127.0.0.1:18093','--gflops','2500','--ollama','http://127.0.0.1:11434') -PassThru -WindowStyle Hidden
              Start-Sleep -Seconds 3
              try { $s = Invoke-RestMethod 'http://127.0.0.1:18093/status' -TimeoutSec 8; Say "status OK: $($s | ConvertTo-Json -Compress)" }
              catch { Say "status FAILED: $($_.Exception.Message)" }
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              Say "smoke-test process stopped"
            } catch { Say "could not start: $($_.Exception.Message)" }
          } else { Say "gpn_provider_status.exe MISSING" }

          Say "== public IP =="
          try { Say "  $(Invoke-RestMethod 'https://api.ipify.org' -TimeoutSec 8)" } catch { Say "  (lookup failed)" }

          Say "== listeners on :8093 =="
          $n = (Get-NetTCPConnection -LocalPort 8093 -State Listen -ErrorAction SilentlyContinue | Measure-Object).Count
          Say "  $n"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: provider-check
          path: ${{ runner.temp }}\provider-check.txt
          if-no-files-found: error
