name: Windows provider readiness check

# Read-only diagnostic: reports whether this self-hosted Windows box is ready to
# run as a GPN AI provider (item 4 / item 14). Makes NO changes and starts
# nothing persistent (the heartbeat smoke test is started then stopped). Results
# are printed and uploaded as the `provider-check` artifact for programmatic
# review.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: Collect diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'provider-check.txt'
          function Say($m) { Write-Host $m; Add-Content -Path $out -Value $m }

          Say "== Ollama =="
          try {
            $t = Invoke-RestMethod "http://127.0.0.1:11434/api/tags" -TimeoutSec 8
            $names = @($t.models | ForEach-Object { $_.name })
            Say "Ollama OK; models: $($names -join ', ')"
            if ($names -contains 'llama3.2:1b') { Say "llama3.2:1b: PRESENT" } else { Say "llama3.2:1b: MISSING" }
          } catch { Say "Ollama NOT reachable at 127.0.0.1:11434 ($($_.Exception.Message))" }

          Say "== running gpn processes =="
          Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -match 'gpn' } | ForEach-Object { Say "  $($_.ProcessName) PID=$($_.Id) started=$($_.StartTime)" }

          Say "== C:\gpn\bin =="
          if (Test-Path 'C:\gpn\bin') {
            Get-ChildItem 'C:\gpn\bin' -Filter *.exe | ForEach-Object { Say "  $($_.Name)  $($_.LastWriteTime)" }
          } else { Say "  (absent)" }

          Say "== env HOME/USERPROFILE =="
          Say "  HOME='$($env:HOME)'"
          Say "  USERPROFILE='$($env:USERPROFILE)'"
          Say "  GPN_PROVIDER_ENDPOINT='$($env:GPN_PROVIDER_ENDPOINT)'"
          Say "  GPN_ASSIGN_STORE='$($env:GPN_ASSIGN_STORE)'"

          Say "== heartbeat binary smoke test =="
          $exe = 'C:\gpn\bin\gpn_provider_status.exe'
          if (Test-Path $exe) {
            try {
              $p = Start-Process -FilePath $exe -ArgumentList @('--listen','127.0.0.1:18093','--gflops','2500','--ollama','http://127.0.0.1:11434') -PassThru -WindowStyle Hidden
              Start-Sleep -Seconds 3
              try { $s = Invoke-RestMethod 'http://127.0.0.1:18093/status' -TimeoutSec 8; Say "status OK: $($s | ConvertTo-Json -Compress)" }
              catch { Say "status FAILED: $($_.Exception.Message)" }
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              Say "smoke-test process stopped"
            } catch { Say "could not start: $($_.Exception.Message)" }
          } else { Say "gpn_provider_status.exe MISSING" }

          Say "== public IP =="
          try { Say "  $(Invoke-RestMethod 'https://api.ipify.org' -TimeoutSec 8)" } catch { Say "  (lookup failed)" }

          Say "== listeners on :8093 and :8094 =="
          foreach ($port in 8093,8094) {
            $n = (Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue | Measure-Object).Count
            Say "  :$port -> $n"
          }

          Say "== assignment stores (item 4/14 remote dispatch) =="
          $cand = @()
          $cand += 'C:\gpn\.gpn\assignments.json'
          if ($env:HOME)        { $cand += (Join-Path $env:HOME '.gpn\assignments.json') }
          if ($env:USERPROFILE) { $cand += (Join-Path $env:USERPROFILE '.gpn\assignments.json') }
          $cand += 'C:\gpn\assignments.json'
          $cand += (Join-Path (Get-Location) '.gpn\assignments.json')
          foreach ($c in ($cand | Select-Object -Unique)) {
            if (Test-Path $c) {
              $len = (Get-Item $c).Length
              $txt = Get-Content $c -Raw -ErrorAction SilentlyContinue
              $tail = if ($txt.Length -gt 600) { $txt.Substring($txt.Length-600) } else { $txt }
              Say "  FOUND $c ($len bytes): ...$tail"
            } else { Say "  absent $c" }
          }

          Say "== provider.log (tail 80) =="
          if (Test-Path 'C:\gpn\provider.log') {
            $fi = Get-Item 'C:\gpn\provider.log'
            Say "  size=$($fi.Length) mtime=$($fi.LastWriteTime)"
            Get-Content 'C:\gpn\provider.log' -Tail 80 -ErrorAction SilentlyContinue | ForEach-Object { Say "  $_" }
          } else { Say "  (no C:\gpn\provider.log)" }

          Say "== scheduled task GPNProvider =="
          schtasks /Query /TN GPNProvider /V /FO LIST 2>&1 | ForEach-Object { Say "  $_" }

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: provider-check
          path: ${{ runner.temp }}\provider-check.txt
          if-no-files-found: error
