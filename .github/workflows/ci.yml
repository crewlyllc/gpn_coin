name: CI

# ---------------------------------------------------------------------------
# Runner policy (2026-10-22, item #69)
#
# GitHub-HOSTED runners are unavailable on this account (billing/spend limit):
# every hosted job comes back with `steps=0` and a failure conclusion, which is
# not a code signal. Essential gates therefore run on the SELF-HOSTED Linux GPU
# runner registered on the dev box (`[self-hosted, linux, gpu]`, labels also
# match `Linux`/`X64`), pinned to low CPU priority so the live node/provider on
# that box are never starved:
#   * every cargo invocation runs under `nice -n 19` with CARGO_BUILD_JOBS=2
#   * CARGO_TARGET_DIR points at a persistent per-repo cache, so re-runs are
#     incremental instead of rebuilding from scratch (and never touch the
#     developer's own target/ dirs)
# The paid macOS/Windows matrix and the dependency audit are manual-only now
# (workflow_dispatch / weekly schedule) so a blocked hosted runner can never
# make `main` red again. A red run from here on means the code is red.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main, master]
  pull_request:
  # Weekly dependency audit (RustSec advisories + licence/ban checks).
  schedule:
    - cron: "0 6 * * 1"
  # Manual trigger: desktop (macOS/Windows) matrix, dependency audit, and the
  # two-node GPU testnet (needs a physical GPU on a self-hosted runner).
  workflow_dispatch:

# One run per ref: a second push must not stack another heavyweight build on
# the box that also serves the network.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Pinned to the same channel as rust-toolchain.toml (1.98.1) so a new stable
  # release cannot silently change the clippy lint set under `-D warnings`.
  RUST_TOOLCHAIN: "1.98.1"
  # Leave the live provider/node headroom on the shared box.
  CARGO_BUILD_JOBS: "2"
  # (CARGO_TARGET_DIR is set per job: incremental, persistent, and outside both
  # the repo and the developer's own target/ dirs.)
  # ---------------------------------------------------------------------------
  # Clippy allow-list (documented).
  #
  # `cargo clippy -- -D warnings` must stay green. The crates below predate a
  # lint-clean baseline and pull in Substrate/FRAME macro expansions we do not
  # control, so a small, explicitly-listed set of lints is allowed. This is the
  # "documented allow-list" option from the production-readiness plan — it is
  # NOT a blanket `-A clippy::all`. Each entry is justified:
  #
  #   deprecated / unexpected_cfgs / duplicate_macro_attributes
  #       Emitted from FRAME/polkadot-sdk macros (e.g. `ConstantWeight_N`),
  #       not from our code. Fixed by the next polkadot-sdk bump, not here.
  #   unused / dead_code / unused_parens
  #       Substrate trait impls and WASM-only stubs legitimately have
  #       host-invisible items; tracking the whole workspace is noise.
  #   clippy::let_unit_value / result_large_err
  #       FRAME dispatch/error enums are large by design; converting would
  #       change the public error surface.
  #   clippy::too_many_arguments / type_complexity / needless_range_loop
  #       Crypto kernels (NTT/MSM/QAP) and pallet APIs are awkward to reshape
  #       without churning proof-critical code. Left as-is on purpose.
  #   clippy::needless_borrow / needless_range_loop / unnecessary_cast /
  #   useless_conversion / unnecessary_mut_passed / clone_on_copy /
  #   derivable_impls / new_without_default / manual_div_ceil /
  #   manual_is_multiple_of / manual_checked_ops / assign_op_pattern /
  #   single_element_loop / missing_const_for_thread_local /
  #   wrong_self_convention / collapsible_match / manual_clamp /
  #   empty_line_after_doc_comments
  #       Low-value style nits; fixing them would touch many files for no
  #       behavioural gain. Revisit as a standalone cleanup PR.
  # ---------------------------------------------------------------------------
  CLIPPY_ALLOWS: >-
    -A deprecated -A unexpected_cfgs -A duplicate_macro_attributes
    -A unused -A dead_code -A unused_parens
    -A clippy::let_unit_value -A clippy::result_large_err
    -A clippy::too_many_arguments -A clippy::type_complexity
    -A clippy::needless_range_loop -A clippy::needless_borrow
    -A clippy::unnecessary_cast -A clippy::useless_conversion
    -A clippy::unnecessary_mut_passed -A clippy::clone_on_copy
    -A clippy::derivable_impls -A clippy::new_without_default
    -A clippy::manual_div_ceil -A clippy::manual_is_multiple_of
    -A clippy::manual_checked_ops -A clippy::assign_op_pattern
    -A clippy::single_element_loop -A clippy::missing_const_for_thread_local
    -A clippy::wrong_self_convention -A clippy::collapsible_match
    -A clippy::manual_clamp -A clippy::empty_line_after_doc_comments

jobs:
  # ---------------------------------------------------------------------------
  # Secret hygiene: reject tracked key material (private seeds / mnemonics).
  # Red-team finding #5 (2026-10-08): a live private seed had been committed to
  # a public file. Redaction is not enough if it can recur, so this is a hard gate.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: secret-scan
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for committed secrets
        run: python3 scripts/check_no_secrets.py

  # ---------------------------------------------------------------------------
  # Formatting + lints. Fast, and the first gate.
  # ---------------------------------------------------------------------------
  lint:
    name: fmt + clippy
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          # Repeated --component: rustup 1.29 rejects a space-separated component
          # list ("invalid toolchain name: 'clippy'"). The runner already carries
          # the pinned toolchain, so an install failure is non-fatal — the version
          # assert below is what actually gates.
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component rustfmt --component clippy || true
          rustup default "$RUST_TOOLCHAIN"
          rustc --version && cargo fmt --version && cargo clippy --version

      - name: Assert Cargo.lock is committed (reproducible builds)
        run: |
          git ls-files --error-unmatch gpn-node/Cargo.lock
          git ls-files --error-unmatch gpn-agent/Cargo.lock

      - name: rustfmt (check)
        run: nice -n 19 cargo fmt --all -- --check
        working-directory: gpn-node

      - name: rustfmt (check, agent)
        run: nice -n 19 cargo fmt --all -- --check
        working-directory: gpn-agent

      - name: Clippy — gpn-node (warnings as errors)
        working-directory: gpn-node
        env:
          CARGO_TARGET_DIR: /home/jeremyg/.ci-cache/gpn-node-target
        # --release on purpose: one profile per repo keeps the persistent cache
        # roughly half the size and lets the build-and-test job reuse it.
        run: nice -n 19 cargo clippy --release --workspace --all-targets -- ${{ env.CLIPPY_ALLOWS }} -D warnings

      - name: Clippy — gpn-agent (warnings as errors)
        working-directory: gpn-agent
        env:
          CARGO_TARGET_DIR: /home/jeremyg/.ci-cache/gpn-agent-target
        run: nice -n 19 cargo clippy --release --all-targets -- ${{ env.CLIPPY_ALLOWS }} -D warnings

  # ---------------------------------------------------------------------------
  # Build + unit tests on the supported (Linux) target. Runs after lint so the
  # box never hosts two heavyweight cargo builds at once.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build + unit tests (linux)
    runs-on: [self-hosted, linux, gpu]
    needs: [lint]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal || true
          rustup default "$RUST_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
          rustc --version
          cmake --version || true

      # gpn-node: Substrate workspace (pallets + gpn-shield + runtime + node).
      # GPU tests are #[ignore]d, so this runs fully on CPU.
      - name: Build gpn-node (release)
        working-directory: gpn-node
        env:
          CARGO_TARGET_DIR: /home/jeremyg/.ci-cache/gpn-node-target
        run: nice -n 19 cargo build --release --workspace

      - name: Test gpn-node (non-GPU)
        working-directory: gpn-node
        env:
          CARGO_TARGET_DIR: /home/jeremyg/.ci-cache/gpn-node-target
        run: nice -n 19 cargo test --release --workspace

      # gpn-agent: GPU node agent (mining / compute / auto-switch). GPU-gated
      # tests are #[ignore]d; pure decision logic + ChainClient tests run on CPU.
      - name: Build gpn-agent (release)
        working-directory: gpn-agent
        env:
          CARGO_TARGET_DIR: /home/jeremyg/.ci-cache/gpn-agent-target
        run: nice -n 19 cargo build --release

      - name: Test gpn-agent (non-GPU)
        working-directory: gpn-agent
        env:
          CARGO_TARGET_DIR: /home/jeremyg/.ci-cache/gpn-agent-target
        run: nice -n 19 cargo test --release

      # Launcher/identity gates (queue #96). Offline, cheap, and they are what
      # stops a shared dev key from being shipped again: the launcher check
      # parses the here-string that release-windows.yml publishes
      # (run-windows/YAML only — no Windows needed), and the wallet check runs
      # the real binaries against a temp base dir.
      - name: Launcher identity self-check (+ negative control)
        run: bash scripts/tests/test-launcher-identity.sh

      - name: Wallet provisioning (per-machine money identity)
        run: |
          bash scripts/tests/test-wallet-provision.sh \
            /home/jeremyg/.ci-cache/gpn-agent-target/release

      # Fast sync (weekly snapshot bootstrap): success, hash mismatch, 404,
      # --no-fast-sync / GPN_FAST_SYNC=0, and a pre-existing DB that must not be
      # touched. Fully offline — the snapshot is exported locally and served by
      # a loopback HTTP server. Also text-asserts the Windows launcher guards.
      - name: Fast sync (snapshot bootstrap) guards
        env:
          GPN_SNAPSHOT_BIN: /home/jeremyg/.ci-cache/gpn-agent-target/release/gpn_snapshot
        run: bash scripts/tests/test-fast-sync.sh

      # Referral capture (data collection only). Offline: install.sh arg
      # parsing (a bare PATH stops it at the prerequisite check, so nothing is
      # built/cloned), write-once storage, Windows launcher parity, and the
      # snapshot's referred_by / referral_summary attribution.
      - name: Referral capture (install + write-once + snapshot)
        run: bash scripts/tests/test-referral.sh

      # Referral download links (`?ref=CODE`): the page-side half. Pure Node,
      # no browser: validation rule, URL parsing, and the XSS boundary (the
      # code is only ever written as text, never as markup).
      - name: Referral links (website ?ref= validation)
        run: node website/tests/referral.test.js

      # Join form: exactly one success message and exactly one failure address
      # (crewlyllc@gmail.com, never shown on success). Pure Node, no browser.
      - name: Join form copy + fallback address
        run: node website/tests/join-form.test.js

      # Chat page (/chat): the markdown renderer's escape boundary (script tags,
      # javascript:/data: links, nested fences), the SSE chunk parser, the
      # conversation cap, and the API error copy. Pure Node, no browser.
      - name: Chat page (markdown + SSE + storage caps)
        run: node website/tests/chat.test.js

      # The Worker's /api/join path: proxies to the AP, keeps the always-200
      # JSON shape, and falls back to email only when nothing was stored.
      - name: Worker unit tests (/api/join + proxies)
        run: node --test worker/worker.test.mjs

  # ---------------------------------------------------------------------------
  # Desktop matrix — EXPERIMENTAL and MANUAL ONLY. macOS/Windows need paid
  # GitHub-hosted minutes which this account cannot use, so a normal push no
  # longer depends on them. Trigger with `workflow_dispatch` when touching
  # platform-specific code (a red run is a signal to investigate, not a blocker).
  # ---------------------------------------------------------------------------
  build-desktop:
    name: Build + unit tests (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf cmake llvm || brew upgrade protobuf cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y protoc llvm cmake
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$env:GITHUB_ENV"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal || true
          rustup default "$RUST_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
          rustc --version

      - name: Build + test gpn-node (release)
        working-directory: gpn-node
        run: cargo build --release --workspace && cargo test --release --workspace

      - name: Build + test gpn-agent (release)
        working-directory: gpn-agent
        run: cargo build --release && cargo test --release

  # ---------------------------------------------------------------------------
  # Supply-chain audit: RustSec advisories (cargo-audit) + licences/bans/sources
  # (cargo-deny). Informational until the dependency-tree licence list is frozen
  # for mainnet; runs weekly and on demand.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit (cargo-audit / cargo-deny)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, gpu]
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Install cargo-audit + cargo-deny
        run: |
          cargo install cargo-audit --locked || cargo install cargo-audit
          cargo install cargo-deny --locked || cargo install cargo-deny

      - name: cargo-audit (gpn-node)
        working-directory: gpn-node
        run: nice -n 19 cargo audit

      - name: cargo-audit (gpn-agent)
        working-directory: gpn-agent
        run: nice -n 19 cargo audit

      - name: cargo-deny (gpn-node)
        working-directory: gpn-node
        run: nice -n 19 cargo deny --config ../deny.toml check advisories bans licenses sources

      - name: cargo-deny (gpn-agent)
        working-directory: gpn-agent
        run: nice -n 19 cargo deny --config ../deny.toml check advisories bans licenses sources

  # Two-node GPU p2p testnet — integration test from
  # gpn-node/scripts/gpn_two_node_testnet.sh. Requires real GPU + NVIDIA OpenCL
  # ICD, so it only runs on a self-hosted runner with the `gpu` label.
  two-node-gpu-testnet:
    name: Two-node GPU testnet (self-hosted GPU)
    runs-on: [self-hosted, linux, gpu]
    # Manual trigger only, so a missing GPU runner never blocks normal CI.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal || true
          rustup default "$RUST_TOOLCHAIN"

      - name: Build gpn-node (release, GPU miner included)
        working-directory: gpn-node
        env:
          CARGO_TARGET_DIR: /home/jeremyg/.ci-cache/gpn-node-target
        run: nice -n 19 cargo build --release --workspace

      - name: Confirm GPU is visible
        run: |
          nvidia-smi --query-gpu=name --format=csv,noheader || echo "no nvidia-smi"
          ls /dev/dri || true

      - name: Run two-node GPU p2p testnet
        working-directory: gpn-node
        run: bash scripts/gpn_two_node_testnet.sh --binary /home/jeremyg/.ci-cache/gpn-node-target/release/gpn-node
