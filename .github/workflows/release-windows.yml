name: Windows binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: choco install -y protoc llvm cmake --no-progress
      - name: rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - name: build agent
        working-directory: gpn-agent
        run: cargo build --release --bins
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: gpn-windows
          path: gpn-agent/target/release/*.exe
          if-no-files-found: error
