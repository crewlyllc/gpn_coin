name: Windows binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"

permissions:
  actions: write    # to prune old artifacts
  contents: write   # to publish downloadable GitHub Releases

jobs:
  windows:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: git config
        run: |
          git config --global core.longpaths true
          git config --global core.protectNTFS false
      - name: deps
        run: choco install -y protoc llvm cmake strawberryperl openssl --no-progress
      - name: refresh path
        shell: powershell
        run: |
          @('C:\Strawberry\perl\bin','C:\Strawberry\c\bin','C:\Program Files\OpenSSL-Win64\bin','C:\Program Files\LLVM\bin') | ForEach-Object {
            Add-Content -Path $env:GITHUB_PATH -Value $_
          }
      - name: rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup target add wasm32-unknown-unknown --toolchain 1.98.1
          rustup component add rust-src --toolchain 1.98.1
      - name: build agent
        working-directory: gpn-agent
        run: cargo build --release --bins
      - name: pre-checkout polkadot-sdk via git CLI
        working-directory: gpn-node
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $rev = 'da5c966029ce352120d5928d789ee3df0f97db46'
          $short = $rev.Substring(0, 7)
          cargo fetch
          $dbRoot = Join-Path $cargoHome 'git\db'
          $db = Get-ChildItem $dbRoot -Directory | Where-Object { $_.Name -like 'polkadot-sdk-*' } | Select-Object -First 1
          if (-not $db) { throw "polkadot-sdk bare db not found under $dbRoot" }
          $hash = $db.Name -replace '^polkadot-sdk-', ''
          $dest = Join-Path $cargoHome "git\checkouts\polkadot-sdk-$hash\$short"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          git clone --no-checkout -- "$($db.FullName)" "$dest"
          git -C "$dest" -c core.protectNTFS=false -c core.longpaths=true -c core.autocrlf=false -c core.eol=lf checkout --force $rev
          git -C "$dest" diff --quiet HEAD
          if ($LASTEXITCODE -ne 0) { throw 'polkadot-sdk worktree does not match HEAD' }
          '{"v":1}' | Out-File -FilePath (Join-Path $dest '.cargo-ok') -Encoding ascii -NoNewline
          Write-Host "OK: polkadot-sdk pre-checked out at $dest"
      - name: build node
        working-directory: gpn-node
        run: cargo build --release -p gpn-node
      - name: prune old artifacts (keep newest 2)
        if: ${{ always() }}
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'gpn-ci' }
          try {
            $all = (Invoke-RestMethod -Headers $h "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100").artifacts
            $old = $all | Where-Object { $_.name -eq 'gpn-windows' } | Sort-Object created_at -Descending | Select-Object -Skip 2
            foreach ($a in $old) {
              Invoke-RestMethod -Method Delete -Headers $h "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($a.id)" | Out-Null
              Write-Host "pruned artifact $($a.id) ($($a.created_at))"
            }
            Write-Host "prune done ($($old.Count) removed)"
          } catch { Write-Host "prune skipped: $($_.Exception.Message)" }
      - name: upload
        uses: actions/upload-artifact@v4
        continue-on-error: true   # artifact storage quota is out of our control; don't fail the build on it
        with:
          name: gpn-windows
          retention-days: 3
          path: |
            gpn-agent/target/release/*.exe
            gpn-node/target/release/gpn-node.exe
          if-no-files-found: error

      - name: ollama pre-flight (REQUIRED - refuse to deploy a node that cannot serve)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '== ollama pre-flight: a GPN node is miner AND AI provider =='
          try {
            $r = Invoke-RestMethod 'http://127.0.0.1:11434/api/tags' -TimeoutSec 4
            Write-Host "ollama OK: $($r.models.Count) model(s) available"
            exit 0
          } catch {
            Write-Host "ollama not answering ($($_.Exception.Message)) - attempting install + start"
          }
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install-ollama.ps1
          try {
            $r = Invoke-RestMethod 'http://127.0.0.1:11434/api/tags' -TimeoutSec 10
            Write-Host "ollama OK after install: $($r.models.Count) model(s) available"
            exit 0
          } catch { }
          Write-Host '::error::ollama is REQUIRED and is not reachable at http://127.0.0.1:11434 - refusing to deploy a node that cannot serve LLM jobs'
          exit 1

      - name: deploy binaries + restart node to C:\gpn\bin  (auto-update)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = 'C:\gpn\bin'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          # ── 0. (Re)write the start script the scheduled task runs, so every
          #      deploy is also a config refresh. chain: prefer the pinned
          #      genesis spec (AP serves it at /genesis-spec) so a fresh node
          #      pegs the canonical genesis WASM; fall back to the named chain.
          $chainSpec = 'C:\gpn\testnet-spec.json'
          $chain = if (Test-Path $chainSpec) { $chainSpec } else { 'testnet' }
          $script = @'
          @echo off
          REM AUTO-GENERATED by .github/workflows/release-windows.yml — do not hand-edit.
          setlocal
          REM best-effort: ensure ollama is serving (the provider needs it).
          powershell -NoProfile -Command "try { Invoke-RestMethod 'http://127.0.0.1:11434/api/tags' -TimeoutSec 3 | Out-Null } catch { if (Get-Command ollama -ErrorAction SilentlyContinue) { Start-Process ollama -ArgumentList 'serve' -WindowStyle Hidden } }"
          set "GPN_CHAIN=__CHAIN__"
          set "GPN_RPC_PORT=9944"
          set "GPN_ENDPOINT=ws://gpn-testnet.duckdns.org:9944"
          set "GPN_SIGNER=//Bob"
          set "GPN_AUTHOR=bob"
          set "GPN_ACCOUNT=5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty"
          set "GPN_OLLAMA=http://127.0.0.1:11434"
          set "GPN_LISTEN=0.0.0.0:8093"
          set "GPN_BIN=C:\gpn\bin"
          REM Pin the node base path so gpn_node's DB/pruning guard and the node's
          REM --base-path agree. (A legacy DB at %LOCALAPPDATA%\gpn-node.exe\data
          REM is still auto-detected by gpn_node for backward-compat.)
          set "GPN_BASE_PATH=C:\gpn\data"
          set "GPN_NODE_KEY=8f9e5ccd99ed3f4516563495d598a7dbcfff5c18b658d3e5cea5718307a4ba74"
          set "GPN_BOOTNODES=/dns4/gpn-testnet.duckdns.org/tcp/30333/p2p/12D3KooWAFtUNxc6RgC9rq5uSHXd5XUncEcPqp77UU98oN6hSVFo"
          cd /d C:\gpn
          REM show output live in the console AND append to node.log (Tee), so an
          REM operator can watch what's happening without tailing the file.
          powershell -NoProfile -Command "& 'C:\gpn\bin\gpn_node.exe' 2>&1 | Tee-Object -FilePath 'C:\gpn\node.log' -Append"
          '@
          $script = $script.Replace('__CHAIN__', $chain)
          Set-Content -Path 'C:\gpn\start-node.cmd' -Value $script -Encoding ascii
          Write-Host "wrote C:\gpn\start-node.cmd (chain=$chain)"

          # ── 1. STOP: end the supervisor task(s) + kill every gpn* process so
          #      the .exe files are not locked. Also retire the legacy
          #      GPNProvider task + its run-provider.ps1 supervisor so exactly
          #      ONE supervisor runs (two would fight over :8094 + the DB).
          # native schtasks writes to stderr when a task is absent; that must not
          # trip $ErrorActionPreference='Stop' — check exit codes explicitly.
          $ErrorActionPreference = 'Continue'
          foreach ($tn in @('GPN-Node','GPNProvider')) { schtasks /End /TN $tn 2>&1 | Out-Null }
          Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" |
            Where-Object { $_.CommandLine -like '*run-provider.ps1*' } |
            ForEach-Object { Write-Host "stopping supervisor pid=$($_.ProcessId)"; Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -like 'gpn*' } | ForEach-Object {
            Write-Host "stopping $($_.ProcessName) (pid $($_.Id))"
            Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 2
          schtasks /Query /TN GPNProvider 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { schtasks /Delete /TN GPNProvider /F 2>&1 | Out-Null; Write-Host 'removed legacy GPNProvider task' }

          # ── 2. COPY the freshly built binaries over the (now unlocked) bins. ─
          $ErrorActionPreference = 'Stop'   # strict again: a failed copy MUST fail the job
          Copy-Item 'gpn-agent\target\release\*.exe' $dst -Force
          Copy-Item 'gpn-node\target\release\gpn-node.exe' $dst -Force
          Write-Host "deployed to $dst :"
          Get-ChildItem $dst -Filter *.exe | ForEach-Object { Write-Host "  $($_.Name)  $([math]::Round($_.Length/1MB,1))MB" }

          # ── 3+4. RESTART — but only via a mechanism that detaches from the
          #     GitHub runner's job process tree (the runner kills its own
          #     children at end-of-job). A Scheduled Task launched by the Task
          #     Scheduler service (schtasks /Run) is NOT a child of the job, so
          #     it survives teardown — this box IS the self-hosted runner, so a
          #     plain Start-Process would take the node offline again.
          if ('${{ vars.GPN_AUTOSTART_NODE }}' -ne 'false') {
            # ollama is REQUIRED — start it detached; fail the job if it can't serve.
            try {
              Invoke-RestMethod 'http://127.0.0.1:11434/api/tags' -TimeoutSec 3 | Out-Null
              Write-Host 'ollama already serving'
            } catch {
              if (Get-Command ollama -ErrorAction SilentlyContinue) {
                Write-Host 'starting ollama serve (detached)'
                ([wmiclass]'Win32_Process').Create('cmd /c ollama serve') | Out-Null
                Start-Sleep -Seconds 3
              } else {
                # The pre-flight step already gated this; never silently deploy a
                # node that cannot serve LLM jobs.
                throw 'ollama is REQUIRED and not installed — aborting deploy (node would be miner-only)'
              }
              try {
                Invoke-RestMethod 'http://127.0.0.1:11434/api/tags' -TimeoutSec 10 | Out-Null
                Write-Host 'ollama is serving after start'
              } catch {
                throw 'ollama did not come up — aborting deploy (node would be miner-only)'
              }
            }

            $tr = 'cmd /c C:\gpn\start-node.cmd'
            $ErrorActionPreference = 'Continue'   # schtasks is native; we check rc explicitly
            schtasks /Create /TN 'GPN-Node' /TR $tr /SC ONLOGON /RL HIGHEST /F 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "schtasks /Create GPN-Node failed (rc=$LASTEXITCODE)" }
            schtasks /Run /TN 'GPN-Node' 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "schtasks /Run GPN-Node failed (rc=$LASTEXITCODE)" }
            Write-Host 'GPN-Node scheduled task (re)created + started'

            Start-Sleep -Seconds 12
            Write-Host '== gpn processes =='
            Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -match 'gpn' } | ForEach-Object { Write-Host "  $($_.ProcessName) PID=$($_.Id)" }
            Write-Host "== node RPC :9944 =="
            try {
              $body = '{"jsonrpc":"2.0","id":1,"method":"system_health","params":[]}'
              $h = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:9944' -ContentType 'application/json' -Body $body -TimeoutSec 8
              Write-Host ("  system_health: " + ($h.result | ConvertTo-Json -Compress))
            } catch { Write-Host "  RPC not answering yet: $($_.Exception.Message)" }
          } else {
            Write-Host 'GPN_AUTOSTART_NODE=false — binaries deployed; node NOT restarted'
          }

      - name: publish GitHub Release (rolling 'windows-latest')
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'gpn-ci'; 'Accept' = 'application/vnd.github+json' }
          $repo = $env:GITHUB_REPOSITORY
          $tag = 'windows-latest'
          $zip = Join-Path $env:RUNNER_TEMP 'gpn-windows.zip'
          # ── Stage the package: binaries at the root + the bundled installer,
          #    example config and first-run docs. The release zip must be enough
          #    to bring a brand-new box to a working (ollama-backed) node.
          $stage = Join-Path $env:RUNNER_TEMP 'gpn-windows-stage'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'gpn-agent\target\release\*.exe' $stage -Force
          Copy-Item 'gpn-node\target\release\gpn-node.exe' $stage -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'scripts') | Out-Null
          foreach ($f in @('scripts\install-ollama.ps1','scripts\install-ollama.sh','scripts\install-ollama-amd.sh')) {
            if (Test-Path $f) { Copy-Item $f (Join-Path $stage 'scripts') -Force } else { throw "missing required package file: $f" }
          }
          foreach ($f in @('gpn-node.example.toml','README-FIRST-RUN.txt')) {
            if (Test-Path $f) { Copy-Item $f $stage -Force } else { throw "missing required package file: $f" }
          }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          Write-Host 'package contents:'
          Get-ChildItem $stage -Recurse -File | ForEach-Object { Write-Host ('  ' + $_.FullName.Substring($stage.Length + 1)) }
          $rel = $null
          try { $rel = Invoke-RestMethod -Headers $h "https://api.github.com/repos/$repo/releases/tags/$tag" } catch {}
          if (-not $rel) {
            $body = @{ tag_name=$tag; name='GPN Windows (latest)'; body="Rolling GPN Windows build. commit $env:GITHUB_SHA"; draft=$false; prerelease=$false; target_commitish='main' } | ConvertTo-Json
            $rel = Invoke-RestMethod -Method Post -Headers $h -ContentType 'application/json' "https://api.github.com/repos/$repo/releases" -Body $body
          }
          foreach ($a in $rel.assets) { if ($a.name -eq 'gpn-windows.zip') { Invoke-RestMethod -Method Delete -Headers $h $a.url | Out-Null } }
          $bytes = [System.IO.File]::ReadAllBytes($zip)
          $up = Invoke-RestMethod -Method Post -Headers $h -ContentType 'application/zip' -Body $bytes "https://uploads.github.com/repos/$repo/releases/$($rel.id)/assets?name=gpn-windows.zip"
          Write-Host "release: $($rel.html_url)  asset: $($up.browser_download_url)  ($([math]::Round($up.size/1MB,1))MB)"
