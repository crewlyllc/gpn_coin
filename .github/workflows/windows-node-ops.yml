---
# Remote operations on the self-hosted Windows node (box 1).
#
# Why: box 1 sits behind a different network, and every diagnosis so far needed a
# human to run a command and paste the output. The self-hosted runner is already
# on that machine, so this exposes a manual-only job that runs a PowerShell
# snippet there and returns the output in the job log.
#
# Guardrails: manual dispatch only; process/service control refused unless the
# caller opts in.
name: Windows node ops

on:
  workflow_dispatch:
    inputs:
      script:
        description: "PowerShell to run on the Windows node"
        required: true
        type: string
      timeout_minutes:
        description: "Job timeout (minutes)"
        required: false
        default: "10"
        type: string
      allow_service_control:
        description: "Permit the script to stop/start gpn processes"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  run:
    name: run script on the Windows node
    runs-on: [self-hosted, Windows]
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    env:
      OPS_SCRIPT: ${{ inputs.script }}
      ALLOW_CONTROL: ${{ inputs.allow_service_control }}
    steps:
      - name: Policy check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ALLOW_CONTROL -ne 'true') {
            if ($env:OPS_SCRIPT -match '(?i)(stop-process|taskkill|schtasks\s+/end|net\s+stop|Restart-Service|Stop-Service|--stop)') {
              throw 'script tries to control processes/services but allow_service_control is false'
            }
          }
          Write-Host 'policy check passed'

      - name: Run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "=== host ==="
          Write-Host "$env:COMPUTERNAME  $(Get-Date -Format o)"
          Write-Host "=== script ==="
          Invoke-Expression $env:OPS_SCRIPT
