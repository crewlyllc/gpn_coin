---
# Remote operations on the self-hosted Windows node (box 1).
#
# Why: box 1 sits behind a different network, and every diagnosis so far needed a
# human to run a command and paste the output. The self-hosted runner is already
# on that machine, so this exposes a manual-only job that runs a PowerShell
# snippet there and returns the output in the job log.
#
# Guardrails: manual dispatch only; process/service control refused unless the
# caller opts in.
name: Windows node ops

on:
  workflow_dispatch:
    inputs:
      script:
        description: "PowerShell to run on the Windows node"
        required: true
        type: string
      timeout_minutes:
        description: "Job timeout (minutes)"
        required: false
        default: "10"
        type: string
      allow_service_control:
        description: "Permit the script to stop/start gpn processes"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  run:
    name: run script on the Windows node
    runs-on: [self-hosted, Windows]
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    env:
      OPS_SCRIPT: ${{ inputs.script }}
      ALLOW_CONTROL: ${{ inputs.allow_service_control }}
      # The repo is private: raw.githubusercontent.com 404s every fetch from this
      # runner (2026-11-19 run 44595896372: `download rc=22 size=0` -> empty helper
      # -> "success" that proved nothing). Scripts must fetch through the API with
      # this token (contents: read) and assert the size, so a failed fetch fails loud.
      GH_TOKEN: ${{ github.token }}
      REPO_SHA: ${{ github.sha }}
    steps:
      # 2026-11-19: the hand-rolled contents-API fetch has now failed twice on this
      # runner (44595896372 `download rc=22 size=0`; 44606185098 `curl: (22) 404`
      # with the job token, against a URL that answers 200 from elsewhere). The
      # runner is already authenticated to the repo, so let checkout do the fetch and
      # give the ops script a real file on disk: a missing file fails loudly instead
      # of an empty one exiting 0.
      - name: Checkout (source for ops scripts)
        uses: actions/checkout@v4
        with:
          path: _ops_src
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Show checked-out source
        shell: powershell
        run: |
          $s = (git -C "$env:GITHUB_WORKSPACE\_ops_src" rev-parse HEAD)
          Write-Host "checked-out sha=$s"
          Write-Host "expected    sha=$env:REPO_SHA"
          $f = Join-Path "$env:GITHUB_WORKSPACE\_ops_src" 'install.ps1'
          if (-not (Test-Path $f)) { throw "install.ps1 missing from the checkout at $f" }
          Write-Host "install.ps1 size=$((Get-Item $f).Length)"
          "OPS_SRC=$env:GITHUB_WORKSPACE\_ops_src" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Policy check
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ALLOW_CONTROL -ne 'true') {
            if ($env:OPS_SCRIPT -match '(?i)(stop-process|taskkill|schtasks\s+/end|net\s+stop|Restart-Service|Stop-Service|--stop)') {
              throw 'script tries to control processes/services but allow_service_control is false'
            }
          }
          Write-Host 'policy check passed'

      - name: Run
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "=== host ==="
          Write-Host "$env:COMPUTERNAME  $(Get-Date -Format o)"
          Write-Host "=== ops source ==="
          Write-Host "OPS_SRC=$env:OPS_SRC sha=$env:REPO_SHA"
          Write-Host "=== script ==="
          $Error.Clear()
          Invoke-Expression $env:OPS_SCRIPT
          Write-Host "=== error records ==="
          Write-Host "$($Error.Count)"
          if ($Error.Count -gt 0) {
            foreach ($e in $Error) { Write-Host "ERR: $($e.ToString())" }
            throw "script wrote $($Error.Count) error record(s) - treat as failure, not success"
          }
