name: Unix binaries (Linux + macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  RUST_TOOLCHAIN: 1.98.1

permissions:
  actions: write
  contents: write   # to publish downloadable GitHub Releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config \
            libssl-dev libclang-dev protobuf-compiler

      - name: deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf cmake llvm openssl || brew upgrade protobuf cmake llvm openssl
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          rustup default ${{ env.RUST_TOOLCHAIN }}
          rustup target add wasm32-unknown-unknown --toolchain ${{ env.RUST_TOOLCHAIN }}
          rustup component add rust-src --toolchain ${{ env.RUST_TOOLCHAIN }}

      - name: build node
        run: cargo build --release --manifest-path gpn-node/Cargo.toml -p gpn-node

      - name: build agent
        run: cargo build --release --manifest-path gpn-agent/Cargo.toml --bins

      - name: upload
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: gpn-${{ runner.os }}
          retention-days: 3
          path: |
            gpn-agent/target/release/gpn_*
            gpn-node/target/release/gpn-node
          if-no-files-found: error

      - name: publish GitHub Release (rolling '<os>-latest')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          tag="${os}-latest"
          asset="gpn-${os}.tar.gz"
          # Package binaries + the bundled ollama installer, example config and
          # first-run docs (mirrors the Windows zip).
          stage="$RUNNER_TEMP/gpn-${os}-stage"
          rm -rf "$stage" && mkdir -p "$stage/scripts"
          cp gpn-agent/target/release/gpn_* gpn-node/target/release/gpn-node "$stage/"
          cp scripts/install-ollama.sh scripts/install-ollama-amd.sh "$stage/scripts/"
          cp gpn-node.example.toml README-FIRST-RUN.txt "$stage/"
          chmod +x "$stage"/gpn_* "$stage/scripts/"*.sh
          ( cd "$stage" && tar -czf "$RUNNER_TEMP/$asset" . )
          echo "package contents:"; find "$stage" -type f | sed "s|$stage/|  |"
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          relid=$(curl -s "${hdr[@]}" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag" | jq -r '.id // empty')
          if [ -z "$relid" ]; then
            curl -s "${hdr[@]}" -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" -d "{\"tag_name\":\"$tag\",\"name\":\"GPN ${os} (latest)\",\"target_commitish\":\"main\"}" >/dev/null
            relid=$(curl -s "${hdr[@]}" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag" | jq -r '.id')
          fi
          asid=$(curl -s "${hdr[@]}" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$relid/assets" | jq -r ".[] | select(.name==\"$asset\") | .id")
          [ -n "$asid" ] && curl -s "${hdr[@]}" -X DELETE "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asid" >/dev/null || true
          curl -s "${hdr[@]}" -H "Content-Type: application/gzip" --data-binary "@$RUNNER_TEMP/$asset" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$relid/assets?name=$asset" >/dev/null
          echo "published $tag / $asset"
