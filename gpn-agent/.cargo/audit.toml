# cargo-audit configuration — GPN agent workspace.
#
# Run:  cd gpn-agent && cargo audit
# Requires: cargo install cargo-audit --locked
#
# Policy (2026-10-26, CI run 40317098274):
#
#   * Fixable advisories are FIXED, not ignored. The 2026-10-26 pass bumped
#     h2 0.4.16, rustls 0.23.46, rustls-webpki 0.103.16 and webpki-roots 1.0.11
#     and cleared 7 advisories.
#   * Every remaining entry below is reachable ONLY through two pinned
#     dependency trees that this repo does not control:
#
#       1. `sp-core` 28 / `sp-runtime` 28 / `sp-wasm-interface` 20
#          (polkadot-sdk 28 series: wasmtime 8, schnorrkel 0.9 ->
#          curve25519-dalek 2, ed25519-zebra 3 -> curve25519-dalek 3).
#          The agent uses sp-core for SS58/AccountId decoding and sr25519
#          signing — it never executes wasm and never uses the trie/wasm
#          runtime paths.
#       2. `subxt` 0.37 -> `jsonrpsee` 0.22 (rustls 0.21/0.22, h2 0.3,
#          rustls-webpki 0.101/0.102) and `smoldot` 0.16 (ruzstd 0.5).
#          These are the light-client / JSON-RPC client transports.
#
#     Clearing them requires an API-breaking upgrade (subxt 0.4x + sp-core 3x)
#     which is tracked as its own task — not something to smuggle into a
#     CI-green change.
#
# Ignoring an id here does not silence the tool: a NEW advisory for any of
# these crates still fails the audit.
#
# Next review: 2027-01-26 (or immediately on any subxt / sp-core / polkadot-sdk
# bump, which is the point at which these all become fixable).

[advisories]
ignore = [
    # --- wasmtime 8.0.1 (sp-wasm-interface 20, i.e. sp-core 28) -------------
    # 22 advisories, all in the wasm *executor* that this binary never
    # instantiates (gpn-agent has no wasm path; sp-wasm-interface is a
    # compile-time dependency of sp-runtime-interface). Fixed by any sp-core
    # >= 3x, which moves to wasmtime >= 24.
    "RUSTSEC-2023-0091", # wasmtime 8: i64x2.shr_s miscompilation (x86_64)
    "RUSTSEC-2024-0438", # wasmtime 8: Windows device-filename sandbox escape
    "RUSTSEC-2025-0118", # wasmtime 8: unsound shared linear memory API
    "RUSTSEC-2026-0020", # wasmtime 8: WASI resource exhaustion
    "RUSTSEC-2026-0021", # wasmtime 8: wasi:http fields panic
    "RUSTSEC-2026-0085", # wasmtime 8: panic lifting component `flags`
    "RUSTSEC-2026-0086", # wasmtime 8: host data leakage (64-bit tables + Winch)
    "RUSTSEC-2026-0087", # wasmtime 8: f64x2.splat miscompile (x86_64)
    "RUSTSEC-2026-0088", # wasmtime 8: pooling-allocator data leakage
    "RUSTSEC-2026-0089", # wasmtime 8: Winch table.fill host panic
    "RUSTSEC-2026-0091", # wasmtime 8: OOB write transcoding component strings
    "RUSTSEC-2026-0092", # wasmtime 8: panic on misaligned UTF-16 strings
    "RUSTSEC-2026-0093", # wasmtime 8: heap OOB read in UTF-16 transcoding
    "RUSTSEC-2026-0094", # wasmtime 8: table.grow return value (Winch)
    "RUSTSEC-2026-0095", # wasmtime 8: Winch sandbox-escaping access
    "RUSTSEC-2026-0096", # wasmtime 8: guest heap access sandbox escape (aarch64)
    "RUSTSEC-2026-0222", # wasmtime 8: store type-index mixing
    "RUSTSEC-2026-0269", # wasmtime 8: filesystem sandbox via trailing slash
    "RUSTSEC-2026-0316", # wasmtime 8: dynamic record lifting allocation
    "RUSTSEC-2026-0363", # wasmtime 8: component handle table limits
    "RUSTSEC-2026-0379", # wasmtime 8: aarch64 br_table miscompile
    "RUSTSEC-2026-0380", # wasmtime 8: cranelift bit-packing miscompile

    # --- schnorrkel 0.9 / ed25519-zebra 3 (sp-core 28) ----------------------
    "RUSTSEC-2024-0344", # curve25519-dalek 2.1.3 + 3.2.0: timing variability
    #   in scalar/point ops used by sr25519 signing. Fix needs dalek >= 4.1.3,
    #   i.e. schnorrkel 0.11 + ed25519-zebra 4, which sp-core 28 does not allow.
    #   (Reached only when signing; the pure-Rust fallback is not constant-time.)

    # --- jsonrpsee 0.22 (subxt 0.37 RPC transport) -------------------------
    "RUSTSEC-2026-0258", # h2 0.3.27 unbounded empty DATA frames. h2 0.3 has
    #   no patched release (fix is h2 >= 0.4.16 = hyper 1.x); hyper 0.14 here
    #   comes from jsonrpsee-http-client 0.22.
    "RUSTSEC-2026-0346", # rustls 0.21.12 + 0.22.4: Debug impls expose TLS
    #   secrets. rustls 0.21/0.22 are used only by jsonrpsee's
    #   hyper-rustls 0.24 / tokio-rustls 0.24-0.25. We never Debug-format a
    #   client session value. Our own reqwest stack uses rustls 0.23.46.
    "RUSTSEC-2026-0349", # rustls 0.21.12 + 0.22.4: ServerHello downgrade.
    "RUSTSEC-2026-0049", # rustls-webpki 0.102.8: CRL distribution point
    #   parsing. Revocation is not checked on the jsonrpsee path.
    "RUSTSEC-2026-0382", # rustls-webpki 0.101.7 + 0.102.8: distrusted
    #   intermediates accepted.
    "RUSTSEC-2026-0099", # rustls-webpki 0.101.7 + 0.102.8: wildcard name
    #   constraints.
    "RUSTSEC-2026-0098", # rustls-webpki 0.101.7 + 0.102.8: URI name
    #   constraints.
    "RUSTSEC-2026-0104", # rustls-webpki 0.101.7 + 0.102.8: CRL parse panic.

    # --- smoldot 0.16 (subxt light client) ---------------------------------
    "RUSTSEC-2026-0344", # ruzstd 0.5.0: decompression bomb (OOM). Fixed by
    #   ruzstd >= 0.9.1, i.e. smoldot >= 0.18, i.e. subxt >= 0.4x. smoldot only
    #   decompresses light-client state it fetched itself over a verified
    #   channel; note this id is distinct from RUSTSEC-2024-0344 above.

    # --- sp-tracing 14/16 pins tracing-subscriber 0.2 exactly --------------
    "RUSTSEC-2025-0055", # tracing-subscriber 0.2.25 ANSI escape poisoning.
    #   sp-tracing (polkadot-sdk 28) pins the 0.2 series; the fix (0.3.20) is a
    #   different major. We do not log peer-supplied strings through its fmt
    #   layer with ANSI enabled.
]
