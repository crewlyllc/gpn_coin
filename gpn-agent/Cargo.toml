[package]
name = "gpn-agent"
version = "0.2.0"
edition = "2021"
description = "GPU Node Agent for GPN Network - manages mining, compute, and staking modes"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["json", "native-tls-vendored", "blocking"] }
tiny_http = "0.12"
thiserror = "2"
anyhow = "1"

# Substrate/RPC
subxt = "0.37"
sp-core = "28"
sp-runtime = "28"

# GPU monitoring
sysinfo = "0.30"

# GPU compute (OpenCL, runtime-loaded — no C headers / CUDA toolkit needed)
opencl3 = { version = "0.12", features = ["dynamic"] }

# Ethash reference (cache + dag sizing + validation)
ethash = "0.4"
hex = "0.4"
ethereum-types = "0.8"
# First-boot AP token generation (24 CSPRNG bytes). Already in the tree via
# sp-core; pinned here so the token source cannot silently change.
getrandom = "0.2"

# Crypto
sha2 = "0.10"
# Release-manifest signature verification (ed25519). Already in the dependency
# graph via sp-core; pinned here as a direct dependency so the updater cannot be
# silently re-pointed at a different verifier.
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "fast"] }

# Snapshot archive (gpn_snapshot): pure-Rust tar + gzip, no C toolchain needed
# (so it builds on the Windows box too). `.tar.zst` uses the external `zstd`
# binary when present.
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Async utilities
futures = "0.3"

# libc (Unix): AF_INET-only getaddrinfo for the IPv4-only callback resolver
# (see src/net.rs — avoids the AAAA stall on hosts with an AAAA-laggy resolver)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# windows-sys (Windows): GetAddrInfoW AF_INET-only resolver. The `libc` crate
# does not export the Winsock getaddrinfo/addrinfo/sockaddr_in symbols on
# Windows, so the Windows path in src/net.rs binds the Win32 API directly.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    # LockFileEx (cross-process GPU lock, src/gpu_yield.rs)
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
sha3 = "0.10"
