[package]
name = "gpn-agent"
version = "0.1.0"
edition = "2021"
description = "GPU Node Agent for GPN Network - manages mining, compute, and staking modes"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["json", "native-tls-vendored", "blocking"] }
tiny_http = "0.12"
thiserror = "2"
anyhow = "1"

# Substrate/RPC
subxt = "0.37"
sp-core = "28"
sp-runtime = "28"

# GPU monitoring
sysinfo = "0.30"

# GPU compute (OpenCL, runtime-loaded — no C headers / CUDA toolkit needed)
opencl3 = { version = "0.12", features = ["dynamic"] }

# Ethash reference (cache + dag sizing + validation)
ethash = "0.4"
hex = "0.4"
ethereum-types = "0.8"

# Crypto
sha2 = "0.10"

# Snapshot archive (gpn_snapshot): pure-Rust tar + gzip, no C toolchain needed
# (so it builds on the Windows box too). `.tar.zst` uses the external `zstd`
# binary when present.
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Async utilities
futures = "0.3"

# libc: AF_INET-only getaddrinfo for the IPv4-only callback resolver
# (see src/net.rs — avoids the AAAA stall on hosts with an AAAA-laggy resolver)
libc = "0.2"

[dev-dependencies]
sha3 = "0.10"
