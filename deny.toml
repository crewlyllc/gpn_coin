    # --- `unsound` advisories that cargo-audit only warns about ------------
    # cargo-deny hard-fails these; the same upstream pins apply, so they are
    # suppressed here with the same reasoning rather than left as a red gate
    # everybody learns to ignore.
    { id = "RUSTSEC-2026-0386", reason = "tokio 1.53.1 AsyncFd I/O-safety; we never construct AsyncFd from a raw fd with an unowned lifetime. Upgrade blocked only by the polkadot-sdk rev" },
    { id = "RUSTSEC-2026-0253", reason = "lru 0.7.8/0.12.5 LruCache::pop panic safety, via substrate's state caches" },
    { id = "RUSTSEC-2026-0002", reason = "lru 0.12.5 IterMut Stacked Borrows, via substrate's state caches" },
    { id = "RUSTSEC-2026-0186", reason = "memmap2 0.5.10 unchecked pointer offset, via substrate's memory-mapped DB; only reachable with an already-corrupt map" },
    { id = "RUSTSEC-2026-0097", reason = "rand 0.7.3 custom-logger unsoundness, via substrate; we install no custom rand logger" },
    { id = "RUSTSEC-2024-0442", reason = "wasmtime-jit-debug 8.0.1 JitDumpFile, via sp-wasm-interface 20; gpn-agent writes no JIT dumps" },
