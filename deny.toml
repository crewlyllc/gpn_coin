# cargo-deny configuration — GPN Network
#
# Run from a workspace root:  cargo deny check
# Requires: cargo install cargo-deny --locked
#
# This is intentionally *informational* in CI (see .github/workflows/ci.yml):
# the licence allow-list for the Polkadot/Substrate dependency subtree is broad
# and is tuned over time. Treat a red `cargo deny check` as a prompt to look,
# not as a release blocker until the list is frozen for mainnet.

[graph]
targets = [
    # Keep in sync with the CI build matrix.
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
    { triple = "wasm32-unknown-unknown" },
]
all-features = false
no-default-features = false

[advisories]
# Vulnerability advisories come from the RustSec database. `db-url` defaults to
# the upstream repo; point it at a mirror here if the runners are air-gapped.
version = 2
yanked = "warn"
# cargo-deny 0.20 removed the old `warn` level for `unmaintained`. These findings
# carry no exploit path ("the author stopped publishing"), and the previous
# setting was explicitly non-failing, so the check is off here. The signal is NOT
# lost: `cargo audit` still prints every unmaintained crate as an allowed
# warning on both workspaces, and the id list is reviewed with the other
# suppressions (2027-01-26). Only *new vulnerabilities* fail this gate.
unmaintained = "none"
ignore = [
    # MIRROR OF THE cargo-audit SUPPRESSIONS. The full per-advisory reasoning
    # lives in gpn-node/.cargo/audit.toml and gpn-agent/.cargo/audit.toml; keep
    # this list in sync with those two files (2026-10-26, CI run 40317098274).
    # Every entry is blocked by a *pinned parent crate* we do not control, not
    # by preference. Review 2027-01-26, or on any polkadot-sdk / litep2p /
    # subxt / sp-core / wasmtime bump.

    # gpn-node + gpn-agent (shared crates)
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 via elliptic-curve 0.13 (sp-core); fix needs elliptic-curve 0.14" },
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3.x via hyper 0.14 (subxt / jsonrpsee 0.22); h2 0.3 has no patched release. Our own paths use h2 0.4.16" },
    { id = "RUSTSEC-2026-0119", reason = "hickory-proto 0.24.4/0.25.2 pinned by libp2p-mdns 0.46 and litep2p 0.14.3; fix needs hickory 0.26" },
    { id = "RUSTSEC-2026-0118", reason = "hickory-proto 0.25.2 NSEC3 loop: no fixed release exists; DNSSEC validation disabled" },
    { id = "RUSTSEC-2025-0009", reason = "ring 0.16.20 via libp2p-tls 0.5 + rcgen 0.11; debug-only overflow panic. Our TLS uses ring 0.17.14" },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.101/0.102 via rustls 0.21/0.22 (libp2p-tls 0.5, jsonrpsee 0.22); our verifier is 0.103.16" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.101/0.102 via libp2p-tls 0.5 / jsonrpsee 0.22" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.101/0.102 via libp2p-tls 0.5 / jsonrpsee 0.22" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.101/0.102 CRL parse panic; CRLs are never parsed on these paths" },
    { id = "RUSTSEC-2025-0055", reason = "tracing-subscriber pinned to =0.3.19 by sc-tracing 28 and to 0.2 by sp-tracing 14/16" },
    { id = "RUSTSEC-2026-0381", reason = "webpki-roots 0.25.4 via libp2p-websocket 0.44; our root store is webpki-roots 1.0.11" },
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13.3 is pinned by wasmtime-internal-cache 36.0.19 (needs wasmtime >=37 for zstd 0.14)" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7.2.4 via zstd 0.13 inside wasmtime 36.x; needs zstd-safe >=8.2.0" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 6.0.6/7.2.4 via zstd 0.12/0.13 inside wasmtime 36.x; needs zstd-safe >=8.2.0" },

    # gpn-agent only (subxt 0.37 / sp-core 28 trees)
    { id = "RUSTSEC-2024-0344", reason = "curve25519-dalek 2.1.3/3.2.0 via schnorrkel 0.9 + ed25519-zebra 3 (sp-core 28); needs dalek 4.x" },
    { id = "RUSTSEC-2026-0346", reason = "rustls 0.21.12/0.22.4 via jsonrpsee 0.22 (subxt 0.37); our stack is rustls 0.23.46 and never Debug-formats session values" },
    { id = "RUSTSEC-2026-0349", reason = "rustls 0.21.12/0.22.4 via jsonrpsee 0.22 (subxt 0.37)" },
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102.8 CRL matching via jsonrpsee 0.22; revocation not checked there" },
