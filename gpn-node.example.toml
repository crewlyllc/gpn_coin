# gpn-node.example.toml — example config for the GPN single-node supervisor
# (task #25). Copy to ~/.gpn/node.toml (or ./gpn-node.toml) and edit.
# Every field can also be set — and overridden — via a GPN_* env var.
# See docs/run-a-node.md for the full reference.
#
# SECURITY: this file may contain a signer seed and the assign token. Keep it
# chmod 600 and out of the repo. Prefer env vars / a systemd EnvironmentFile
# for secrets.

# A GPN node is ALWAYS both a miner and an AI provider — there is no role
# option. Every start brings up the chain node/miner, the provider heartbeat,
# and ALL provider loops together. "One GPU, one job" means ONE JOB AT A TIME
# (mutual exclusion) — NOT a limit on job types: by design every node can serve
# LLM · image · video · ML inference · fine-tune. Per-capability OPT-OUT below
# exists for constrained boxes; the default is everything ON.

# ── node / miner ────────────────────────────────────────────────────────────
chain     = "testnet"                    # testnet | mainnet | dev | <path to chain-spec.json>
signer    = "//Alice"                    # sr25519 URI or seed (authoring key + provider identity)
account   = ""                           # payout / advertised ss58 address (optional)
base_path = "~/.gpn/node"
rpc_port  = 9944
node_key  = ""                           # 64-hex ed25519 network key (the node requires one)
bootnodes = []                           # e.g. ["/ip4/23.241.109.255/tcp/30333/p2p/12D3KooW…"]
author    = ""                           # short authoring key name → --<name> (e.g. "alice")
node_args = ["--no-telemetry", "--no-prometheus"]

# ── provider ────────────────────────────────────────────────────────────────
endpoint          = "ws://127.0.0.1:9944"                    # chain RPC the provider loop uses
provider_endpoint = ""                                       # public /status URL advertised on-chain
assign_token      = ""                                       # shared AP<->provider secret (GPN_ASSIGN_TOKEN)
# ollama is REQUIRED (a node is miner AND AI provider). If it is not reachable
# here, `gpn_node` attempts an automated install/start (`GPN_OLLAMA_SETUP=1`)
# and then REFUSES TO START unless GPN_REQUIRE_OLLAMA=0. See docs/run-a-node.md.
ollama            = "http://127.0.0.1:11434"
listen            = "0.0.0.0:8093"
gflops            = 0
capacity          = 1
poll_ms           = 300
# ── optional providers: ON by design; set false to OPT a capability OUT ──
diffusion         = true     # image/video provider (gpn_diffusion_provider)
diffusion_poll_ms = 2000
ml                = true     # ML-inference provider (gpn_ml_provider)
ml_poll_ms        = 2000
finetune          = true     # fine-tune provider (gpn_finetune_provider)
finetune_poll_ms  = 4000

# ── supervisor ──────────────────────────────────────────────────────────────
# bin_dir     = "~/.local/bin"   # dir holding the child binaries (default: dir of gpn_node)
# status_secs = 15               # aggregated status-line interval
