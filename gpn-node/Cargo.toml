frame-system-rpc-runtime-api = { git = "https://github.com/paritytech/polkadot-sdk.git", rev = "da5c966029ce352120d5928d789ee3df0f97db46", default-features = false }
substrate-wasm-builder = { git = "https://github.com/paritytech/polkadot-sdk.git", rev = "da5c966029ce352120d5928d789ee3df0f97db46" }
frame-try-runtime = { git = "https://github.com/paritytech/polkadot-sdk.git", rev = "da5c966029ce352120d5928d789ee3df0f97db46", default-features = false }

