[workspace]
members = [
    "pallets/gpu-pow",
    "pallets/gpu-attestation",
    "pallets/gpn-liveness",
    "pallets/gpn-treasury",
    "pallets/compute-marketplace",
    "pallets/profitability-oracle",
    "pallets/gpn-token",
    "pallets/shielded-pool",
    "pallets/gpn-governance",
    "gpn-shield",
    "runtime",
    "node",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "GPU-Native Crypto & AI Compute Network"
license = "Apache-2.0"

[workspace.dependencies]
# Substrate / Polkadot SDK — frame
frame-support = { git = "https://github.com/paritytech/polkadot-sdk.git", rev = "da5c966029ce352120d5928d789ee3df0f97db46", default-features = false }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk.git", rev = "da5c966029ce352120d5928d789ee3df0f97db46", default-features = false }
