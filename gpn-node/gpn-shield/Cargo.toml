[package]
name = "gpn-shield"
version = "0.3.1"
edition = "2021"
description = "GPN shielded-pool client prover (Step 5): generates Groth16 proofs over BLS12-381 byte-compatible with pallet-shielded-pool's on-chain verifier"
license = "Apache-2.0"

[dependencies]
# Same crates the runtime verifier uses, so the client proof format is
# guaranteed identical (G1/G2 compressed + Fr big-endian). No heavy ZK stack.
bls12_381 = { version = "0.8", features = ["alloc", "pairings"] }
ff = "0.13"
# Constant-time primitive selection (`Choice`, `ConditionallySelectable`) for
# the keygen (setup) path that touches secret CRS scalars. Same version
# bls12_381 0.8 links against, so no duplicate crate in the graph.
subtle = "2.6"
# Parallelise the prover's elliptic-curve scalar-mult loops across CPU cores.
rayon = "1"
# Trusted-setup ceremony tooling (ceremony module + `gpn_ceremony` bin):
# sha256 CRS digests / hash-chain, JSON contribution transcripts, and
# toxic-waste wiping of the fresh contribution scalars.
sha2 = "0.10"
serde_json = "1"
zeroize = "1.8"

[dev-dependencies]
# Property-based differential/fuzz tests (item 6 of the prod-readiness plan).
proptest = "1"
