[package]
name = "gpn-node"
version = "0.3.0"
edition = "2021"

[dependencies]
# Local
gpn-runtime = { path = "../runtime" }
pallet-gpu-pow = { path = "../pallets/gpu-pow" }
pallet-gpu-attestation = { path = "../pallets/gpu-attestation" }

# Substrate / Polkadot SDK
frame-system = { workspace = true }
frame-benchmarking = { workspace = true, optional = true }
pallet-transaction-payment = { workspace = true, default-features = false }
pallet-sudo = { workspace = true, default-features = false }
pallet-transaction-payment-rpc-runtime-api = { workspace = true, features = ["std"] }
frame-system-rpc-runtime-api = { workspace = true, features = ["std"] }
sc-basic-authorship = { workspace = true }
sc-chain-spec = { workspace = true }
sc-cli = { workspace = true }
sc-client-api = { workspace = true }
sc-consensus = { workspace = true }
sc-consensus-pow = { workspace = true }
sc-offchain = { workspace = true }
sc-executor = { workspace = true }
sc-network = { workspace = true }
sc-network-sync = { workspace = true }
sc-rpc = { workspace = true }
sc-service = { workspace = true }
sc-telemetry = { workspace = true }
sc-tracing = { workspace = true }
sc-transaction-pool = { workspace = true }
sc-transaction-pool-api = { workspace = true }
sp-api = { workspace = true }
sp-block-builder = { workspace = true }
sp-blockchain = { workspace = true }
sp-consensus = { workspace = true }
sp-consensus-pow = { workspace = true }
sp-core = { workspace = true }
sp-inherents = { workspace = true }
sp-io = { workspace = true }
sp-keystore = { workspace = true }
sp-runtime = { workspace = true }
sp-timestamp = { workspace = true }
sp-transaction-pool = { workspace = true }
substrate-prometheus-endpoint = { workspace = true }

# Common
codec = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
jsonrpsee = { version = "0.24", features = ["server", "macros"] }
serde_json = "1"
hex = "0.4"

# Peer discovery: Bitcoin-style DNS seeds (TXT multiaddrs) + HTTP(S) seed lists.
# hickory-resolver is already in the dependency graph via litep2p, so this adds
# no new crates. Plain http:// seed lists use attohttpc (built without TLS).
# https:// seed lists (the default network directory is
# https://gpncoin.ai/seeds.json) use tokio-rustls + rustls + webpki-roots —
# all three are already in the dependency graph (rustls 0.23 / tokio-rustls
# 0.26 via libp2p), so this adds no new transitive crates, only the `ring`
# crypto provider that the existing graph already builds.
hickory-resolver = "0.25"
attohttpc = { version = "0.24", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
url = "2"

# Automatic NAT port mapping (design §5.5): UPnP-IGD discovery + AddPortMapping.
# igd-next is already in the dependency graph via libp2p-upnp, so this adds no
# new transitive crates. Version is pinned to the locked 0.14.x.
igd-next = { version = "0.14", default-features = false }

# Real Ethash PoW (memory-hard, GPU-mineable). Light-cache mode lets a CPU
# mine/verify the same algorithm a GPU miner targets with the full DAG.
ethash = "0.4"
ethereum-types = "0.8"

# GPU Ethash mining via OpenCL (runtime-loaded kernels — no CUDA/C headers).
opencl3 = { version = "0.12", features = ["dynamic"] }

[dev-dependencies]
# Used by the dialability gate's stub-network tests (implements the async
# sc-network traits).
async-trait = "0.1"

[features]
default = []
runtime-benchmarks = [
    "gpn-runtime/runtime-benchmarks",
    "frame-benchmarking",
]
